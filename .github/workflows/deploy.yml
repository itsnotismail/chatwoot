name: Deploy

on:
  push:
    branches: [comvor-prod]

concurrency:
  group: deploy-comvor-chatwoot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chatwoot fork
        uses: actions/checkout@v4
        with:
          path: seytu-cw

      - name: Checkout comvor-deploy
        uses: actions/checkout@v4
        with:
          repository: itsnotismail/comvor-deploy
          ref: main
          path: comvor-deploy
          # comvor-deploy is PRIVATE and the default github.token is scoped to
          # THIS repo only — without a deploy key this step 404s. Read-only
          # deploy key on comvor-deploy; distinct from KAMAL_SSH_KEY. This
          # checkout runs before the ssh-agent step, so no key conflict.
          ssh-key: ${{ secrets.DEPLOY_CONFIG_KEY }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      - name: Install bws CLI
        run: |
          curl -sL -o /tmp/bws.zip \
            https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          sudo unzip -o /tmp/bws.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/bws
          bws --version

      - name: Trust the droplet's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 152.42.221.28 >> ~/.ssh/known_hosts

      - name: Load the Kamal deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_KEY }}

      - name: Deploy the Chatwoot fork
        working-directory: comvor-deploy
        env:
          COMVOR_HOST: 152.42.221.28
          BWS_PROJECT_ID: 5e0cc87e-27bb-451f-a308-b4870127e22b
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          # See the VERSION note in deploy.comvor-api's workflow / Global Constraints.
          VERSION: ${{ github.sha }}
        run: kamal deploy -c config/deploy.chatwoot.yml
